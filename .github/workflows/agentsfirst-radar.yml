name: agentsfirst-radar

# Daily-cron evolution of /agentsfirst-check. See:
#   docs/plans/2026-05-15-agentsfirst-radar-design.md §4.3
#   tools/agentsfirst-radar/AGENTS.md §Sequence
#
# Runs at 07:00 America/Chicago. The cron string `0 12 * * *` is 12:00 UTC,
# which is 07:00 CDT (DST) and 06:00 CST (standard). The DST-guard step
# self-checks the local TZ and bails (exit 0) when local hour ≠ 07 — so a
# double-fire across DST transitions is impossible.
#
# Runs on the joshhome self-hosted runner because the radar needs chat.db
# access (iMessage) and a long-lived process that can sqlite3 the local
# Messages store. Cloudflare Worker / Mac LaunchAgent were rejected in the
# design (see §4.3 comparison table).

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: no commits, no iMessage, no state mutations'
        type: boolean
        default: false
        required: false
      skip_tz_guard:
        description: 'Bypass the Chicago-hour check (use for off-hours debug only)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write    # commit briefing + last-run.txt + snapshot-weekly

concurrency:
  group: agentsfirst-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: [self-hosted, joshhome]
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY:        ${{ secrets.XAI_API_KEY }}
      MULTIPOV_API_KEY:   ${{ secrets.MULTIPOV_API_KEY }}
      SOCIAL_WORKER_KEY:  ${{ secrets.SOCIAL_WORKER_KEY }}
      HC_PING_URL:        ${{ secrets.HC_RADAR_PING_URL }}
      # RSSHub host comes from a GHA secret so the Tailscale MagicDNS name
      # never lands in this committed YAML (kept out of secrets-guard's
      # internal-URL scanner).
      RADAR_RSSHUB_HOST:  ${{ secrets.RADAR_RSSHUB_HOST }}
      RADAR_DRY_RUN:      ${{ inputs.dry_run && '1' || '' }}
    steps:
      - name: DST guard
        if: ${{ !inputs.skip_tz_guard }}
        run: |
          CHICAGO_HOUR=$(TZ='America/Chicago' date +%H)
          if [ "$CHICAGO_HOUR" != "07" ]; then
            echo "Skipping: Chicago hour is $CHICAGO_HOUR, not 07 (DST boundary)"
            # exit 0 (not failure) — HC must not fire /failure on a legitimate DST skip.
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: tools/agentsfirst-radar
        run: npm ci

      - name: State backup (pre-run, per design R4)
        run: |
          if [ -f state/radar-state.json ]; then
            SCHEMA_VERSION=$(jq -r '.schema_version' state/radar-state.json)
            cp state/radar-state.json "state/radar-state.json.v${SCHEMA_VERSION}.bak"
            echo "Backed up state at schema_version=$SCHEMA_VERSION"
          else
            echo "No state file yet — cold start; radar will write degraded briefing."
          fi

      - name: Run radar
        working-directory: tools/agentsfirst-radar
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_tz_guard }}" = "true" ]; then ARGS="$ARGS --skip-tz-guard"; fi
          npm run radar -- $ARGS

      - name: Commit briefing + state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "agentsfirst-radar"
          git config user.email "radar@agentsfirst.dev"
          # Only commit the COMMITTED-state allowlist (per .gitignore + design §4.1):
          #   - docs/checks/ (the briefing itself)
          #   - state/last-run.txt (dead-man's-switch input)
          #   - state/snapshot-weekly.json (cold-start anchor; written weekly)
          # Mutable runtime state (radar-state.json, mutations.jsonl, imsg-unparsed.jsonl,
          # llm-anomalies.jsonl, *.bak) is gitignored.
          git add docs/checks/ state/last-run.txt 2>/dev/null || true
          if [ -f state/snapshot-weekly.json ]; then
            git add state/snapshot-weekly.json
          fi
          git diff --cached --quiet || git commit -m "chore(radar): briefing $(date -u +%Y-%m-%d)"
          git push

      - name: Heartbeat
        if: always()
        run: |
          # HC slug pattern: $HC_PING_URL is base; append /success or /fail.
          STATUS_SLUG=success
          if [ "${{ job.status }}" != "success" ]; then STATUS_SLUG=fail; fi
          if [ -n "$HC_PING_URL" ]; then
            curl -fsS --max-time 10 "$HC_PING_URL/$STATUS_SLUG" > /dev/null \
              || echo "[heartbeat] HC ping failed — non-fatal; dead-man's-switch will catch outages"
          else
            echo "[heartbeat] HC_PING_URL unset — skipping (one of the TODO infra items)"
          fi
