# Repo-level secrets-guard allowlist.
#
# `_includes/head-custom.html` contains intentionally-public client-side
# analytics identifiers (GA4 Measurement ID, Cloudflare Web Analytics
# beacon token). These are NOT secrets — they ship in the rendered HTML
# of every public page and are visible to any browser's view-source.
# Cloudflare and Google issue them precisely so they can live in client
# JS. See https://developers.cloudflare.com/web-analytics/ + GA4 docs.
#
# `index.md` is the published thesis. It cites public X/Twitter posts via
# their canonical URLs (https://x.com/<handle>/status/<19-digit-id>).
# Some 19-digit tweet IDs happen to be Luhn-valid and trip the secrets
# scanner's PII-CC heuristic. The IDs are public references, not secrets.
paths:
  - "_includes/head-custom.html"
  - "index.md"
rules: {}
