title: Agents First
description: Every product is getting a second customer — the human who pays, and the agent who decides. A design framework for building products that AI agents can use as primary consumers.
url: https://agentsfirst.dev
baseurl: ""
theme: jekyll-theme-cayman
markdown: kramdown
plugins:
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: true

author:
  name: Joshua Baer
  twitter: joshuabaer

twitter:
  username: joshuabaer
  card: summary_large_image

social:
  name: Joshua Baer
  links:
    - https://twitter.com/joshuabaer
    - https://github.com/joshuabaer

image: /og-image.png

logo: /og-image.png

exclude:
  - docs/
  - tools/
  - bugs/
  - todo.md
  - todolist-archive.md
  - CLAUDE.md
  - .claude/
  - .github/
  - bin/
  - Gemfile
  - Gemfile.lock

# Jekyll excludes dot-directories by default; we need .well-known/ served.
include:
  - .well-known
  - .well-known/mcp-server-card.json

# Don't run AGENTS.md, llms.txt, or the JSON catalogs through any Liquid/markdown processing —
# they need to be served verbatim as agent-readable artifacts.
keep_files:
  - AGENTS.md
  - llms.txt
  - api
  - .well-known
